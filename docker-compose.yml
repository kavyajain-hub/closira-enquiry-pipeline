version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: closira_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: closira_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - closira_network

  redis:
    image: redis:7-alpine
    container_name: closira_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - closira_network

volumes:
  postgres_data:
  redis_data:

networks:
  closira_network:
    driver: bridge
